<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Devpilot · Software and web development, Ljubljana</title>
<meta property="og:image" content="https://devpilotbot.github.io/devpilot/assets/og-contour.png">
<meta name="twitter:image" content="https://devpilotbot.github.io/devpilot/assets/og-contour.png">
<meta name="description" content="Devpilot designs, builds and runs web applications, internal tools and websites. Written scope, working previews and code you own.">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ECE8E3'/%3E%3Cpath d='M0 0H16A16 16 0 0 1 16 32H11.325V21.3125H16A5.3125 5.3125 0 1 0 10.6875 16V20.675H0Z' fill='%230D0D0D'/%3E%3C/svg%3E">
<style>
  /* Self-hosted latin subsets (same files Google Fonts served): Geist and Geist Mono are both variable (wght 100–900). */
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(assets/fonts/gyByhwUxId8gMEwcGFU.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(assets/fonts/or3nQ6H-1_WfwkMZI_qYFrcdmg.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* The picker: one dark strip over four full pages. It is review furniture, so it stays quiet and the same in every theme. */
  :root { --bar: #111210; --bar-2: #1c1d1a; --bar-fg: #f3f2ee; --bar-muted: #9a978d; --bar-line: #2e2f2b; --bar-h: 56px;
          --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bar); color: var(--bar-fg); font: 14px/1.4 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--bar-line); background: var(--bar); }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .tag { color: var(--bar-muted); white-space: nowrap; }
  .seg { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--bar-line); border-radius: 99px; }
  .seg button { height: 32px; padding: 0 14px; border: 0; border-radius: 99px; background: none; color: var(--bar-muted); font: 500 13px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: color .2s, background .2s; }
  .seg button b { font: 500 11px var(--mono); letter-spacing: .06em; }
  .seg button:hover { color: var(--bar-fg); }
  .seg button[aria-pressed="true"] { background: var(--bar-fg); color: var(--bar); }
  .seg button:focus-visible { outline: 2px solid var(--bar-fg); outline-offset: 2px; }
  .desc { color: var(--bar-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .open { margin-left: auto; color: var(--bar-muted); text-decoration: none; white-space: nowrap; border: 1px solid var(--bar-line); border-radius: 99px; padding: 7px 12px; transition: color .2s, border-color .2s; }
  .open:hover { color: var(--bar-fg); border-color: var(--bar-fg); }
  .page { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); width: 100%; height: calc(100% - var(--bar-h) - env(safe-area-inset-top, 0px)); border: 0; background: var(--bar-2); }
  @media (max-width: 760px) { .desc, .tag { display: none; } .bar { gap: 10px; } .seg button { padding: 0 11px; } .seg button span { display: none; } }
</style>
</head>
<body>


<div class="bar" role="toolbar" aria-label="Variant picker">
  <span class="tag mono">Devpilot · Contour review · A–D</span>
  <div class="seg" id="seg">
    <button type="button" data-v="a" aria-pressed="false"><b>A</b><span>Paper</span></button>
    <button type="button" data-v="b" aria-pressed="false"><b>B</b><span>Blueprint</span></button>
    <button type="button" data-v="c" aria-pressed="false"><b>C</b><span>Stage</span></button>
    <button type="button" data-v="d" aria-pressed="true"><b>D</b><span>Contour</span></button>
  </div>
  <span class="desc" id="desc"></span>
  <a class="open mono" id="open" href="variants/d.html" target="_blank" rel="noopener">Open on its own ↗</a>
</div>
<!-- No src here: the script below picks the variant (hash → last choice → D) and sets it, so the first load is the right page. -->
<iframe class="page" id="page" title="Variant D · Contour"></iframe>
<noscript><iframe class="page" title="Variant D · Contour" src="variants/d.html"></iframe></noscript>

<script>
  const V = {
    a: ["Paper", "Warm paper, Geist, the products demoed in place. Credible and calm."],
    b: ["Blueprint", "A drafting sheet: navy ink on a grid, title blocks, a schedule of services, a programme drawn to scale."],
    c: ["Stage", "A dark showroom: wide Archivo, the products on a lit stage, one tungsten accent, an amber close."],
    d: ["Contour", "Ink and bone, instrument UI, one ignition accent. Software and web development from Ljubljana."],
  };
  const seg = document.getElementById("seg"), page = document.getElementById("page"), desc = document.getElementById("desc"), open = document.getElementById("open");
  let current = "";
  function show(v, push) {
    if (!V[v] || v === current) return;
    current = v;
    for (const b of seg.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === v));
    page.src = `variants/${v}.html`;
    page.title = `Variant ${v.toUpperCase()} · ${V[v][0]}`;
    desc.textContent = `${v.toUpperCase()} · ${V[v][1]}`;
    open.href = `variants/${v}.html`;
    try { localStorage.setItem("devpilot-variant", v); } catch {}
    if (push) { try { history.replaceState(null, "", `#${v}`); } catch {} }
  }
  seg.addEventListener("click", (e) => { const b = e.target.closest("button[data-v]"); if (b) show(b.dataset.v, true); });
  addEventListener("keydown", (e) => { if (e.target.closest("input, textarea")) return; const k = { 1: "a", 2: "b", 3: "c", 4: "d" }[e.key]; if (k) show(k, true); });
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (V[h]) show(h, false); });
  let start = location.hash.slice(1);
  if (!V[start]) { try { start = localStorage.getItem("devpilot-variant") || ""; } catch {} }
  show(V[start] ? start : "d", false); /* overnight: Contour D is the review tip */
</script>
</body>
</html>
